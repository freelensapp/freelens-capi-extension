name: Test environment

# The two tiers of the test environment (docs/development/TESTING.md): the fixtures on the definitions alone,
# read back as their files, and the real project, brought up, checked, brought up again, tried by the tests of
# the real tier and by the sessions of the real tier in Freelens dev, on each release of Freelens of the integration
# tests, and taken down. They run when what they run changes, on main, and every night, when an image that a pinned
# manifest names by its tag may have moved. What they run includes the main process and the shared modules,
# src/main and src/common, which the tests and the sessions of the real tier load, the view, src/renderer, and the
# build that makes the extension that the sessions install, vite.config.mjs and build, the unit tests of the sources
# left out, and the sessions of the real tier and what they import (SPEC-0004, P33, "Notes and deviations"). The paths
# start both jobs of the workflow, the fixtures too. Nothing of the private state of the scripts, a kubeconfig above
# all, leaves the runner.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
    paths:
      - .github/workflows/test-environment.yaml
      - .github/workflows/integration-tests.yaml
      - .nvmrc
      - build/**
      - e2e/**
      - integration/fixtures/**
      - integration/__tests__/cluster-tree-real.tests.ts
      - integration/__tests__/clusters-real.tests.ts
      - integration/__tests__/clusters-sveltos.tests.ts
      - integration/__tests__/expected-refusals.ts
      - integration/__tests__/extension-helpers.ts
      - integration/__tests__/real-project-checks.ts
      - integration/__tests__/tree-outline.ts
      - integration/__tests__/tree-page.ts
      - package.json
      - pnpm-lock.yaml
      - src/main/**
      - src/common/**
      - "!src/common/**/*.test.ts"
      - src/renderer/**
      - "!src/renderer/**/*.test.ts"
      - "!src/renderer/**/*.test.tsx"
      - test/real-project/**
      - "!test/real-project/**/*.test.ts"
      - test/status-*.ts
      - vite.config.mjs
      - vitest.integration.config.ts
      - vitest.integration-real-project.config.ts
      - vitest.real-project.config.ts
  schedule:
    - cron: 17 3 * * *
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fixtures:
    name: test environment fixtures

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup pnpm
        run: corepack enable

      - name: Get pnpm cache directory
        shell: bash
        run: echo "pnpm_cache_dir=$(pnpm store path)" >> ${GITHUB_ENV}

      # The job of the real project saves this cache, under the same key: restored alone here, so that the two jobs,
      # which run side by side, do not both save it.
      - name: Use pnpm cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.pnpm_cache_dir }}
          key: ubuntu-24.04-node-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ubuntu-24.04-node-

      - name: Install pnpm dependencies
        id: install-pnpm
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile
        continue-on-error: true

      - name: Install pnpm dependencies (retry)
        if: steps.install-pnpm.outcome == 'failure'
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile

      # The private state of the scripts, outside the checkout, as they ask.
      - name: Set the state folder of the scripts
        run: echo "XDG_STATE_HOME=${RUNNER_TEMP}/test-environment" >> "${GITHUB_ENV}"

      # kind is pinned once, in the env of the integration workflow, where the scripts read it too.
      - name: Get the version of kind
        id: kind
        run: |
          version=$(sed -n 's/^  kind_version: *\([0-9.]*\).*/\1/p' .github/workflows/integration-tests.yaml)
          if ! printf '%s\n' "${version}" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::integration-tests.yaml has no kind_version in its env that this step can read"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          version: v${{ steps.kind.outputs.version }}
          install_only: true

      - name: Create the cluster of the definitions
        run: pnpm e2e:cluster:up:definitions

      # Each fixture set applied, read back at the version of its file and compared with it.
      - name: Check the fixtures against their files
        run: pnpm e2e:fixtures:check

      - name: Take the test environment down
        if: always()
        run: pnpm e2e:cluster:down

  real-project:
    name: "test environment real project with Freelens ${{ matrix.freelens_version }}"

    # One job for each release of Freelens of the integration tests (integration-tests.yaml), each with the real
    # project of its own, its tests of the real tier, and Freelens dev at its release, built as the integration tests
    # build it, for the sessions of the real tier (SPEC-0004, P33).
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Freelens releases the extension supports, by their tags, as in integration-tests.yaml.
          - freelens_version: v2.1.0

    # The two hours of P33, from the durations of the runs (SPEC-0004, "Notes and deviations"): the job took 8 to 10
    # minutes in CI with sessions that settled at once, the real project up in 2.5 and the tests of the real tier in 4.5,
    # and 22 when its sessions waited their polls of 10 minutes.
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    # A new push to a pull request cancels the jobs of the real project that still run for it, each release in a group
    # of its own, so that the jobs of a run do not cancel each other. The runs of main and of the night each have
    # groups of their own, and none is cancelled.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('test-environment-real-project-pr-{0}-{1}', github.event.pull_request.number, matrix.freelens_version) || format('test-environment-real-project-run-{0}-{1}', github.run_id, matrix.freelens_version) }}
      cancel-in-progress: true

    env:
      DO_NOT_TRACK: "1"
      TURBOREPO_CACHE: ${{ github.workspace }}/freelens/.turbo

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # yq comes from mise so that its version has a single source (mise.toml) and the download is verified against
      # mise.lock, as in integration-tests.yaml.
      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.11.14 # datasource=github-releases depName=jdx/mise
          install_args: yq

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup pnpm
        run: corepack enable

      - name: Get pnpm cache directory
        shell: bash
        run: echo "pnpm_cache_dir=$(pnpm store path)" >> ${GITHUB_ENV}

      # One key for the jobs of the workflow: this job saves the cache, and the job of the fixtures restores it alone,
      # so that the two jobs, which run side by side, do not both save it. The matrix has one release, so this step
      # has no condition, and no step restores the cache alone in a job of the matrix, which would never run. A
      # release added to the matrix needs both: a condition that leaves the save to the job of one release, and a step
      # that restores the cache alone in the jobs of the others.
      - name: Use pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.pnpm_cache_dir }}
          key: ubuntu-24.04-node-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ubuntu-24.04-node-

      - name: Install pnpm dependencies
        id: install-pnpm
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        continue-on-error: true

      - name: Install pnpm dependencies (retry)
        if: steps.install-pnpm.outcome == 'failure'
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Set the state folder of the scripts
        run: echo "XDG_STATE_HOME=${RUNNER_TEMP}/test-environment" >> "${GITHUB_ENV}"

      - name: Get the version of kind
        id: kind
        run: |
          version=$(sed -n 's/^  kind_version: *\([0-9.]*\).*/\1/p' .github/workflows/integration-tests.yaml)
          if ! printf '%s\n' "${version}" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::integration-tests.yaml has no kind_version in its env that this step can read"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          version: v${{ steps.kind.outputs.version }}
          install_only: true

      # It waits until the first workload cluster reports Available True, and fails otherwise.
      - name: Bring the real project up
        run: pnpm e2e:cluster:up

      - name: Check that the first workload cluster reports Available True
        run: |
          available=$(kubectl get clusters.v1beta2.cluster.x-k8s.io freelens-capi-md --namespace default \
            --output 'jsonpath={.status.conditions[?(@.type=="Available")].status}')
          echo "freelens-capi-md reports Available ${available:-nothing}"
          test "${available}" = True
        env:
          KUBECONFIG: ${{ runner.temp }}/test-environment/freelens-capi-extension/freelens-capi-management/kubeconfig

      # Run again, it resumes: it uses the kind cluster it created and creates nothing that exists.
      - name: Bring the real project up again
        run: pnpm e2e:cluster:up

      # The tests of the real tier, which run here alone: S7 of SPEC-0001 (SPEC-0003, P32), which writes only to
      # the cluster of the real project, through the scripts, in a namespace of its own that it deletes at the end.
      # It reads the namespace for ten minutes at most, and deletes it in the rest of its quarter of an hour; the
      # trial by hand saw its workload clusters gone in 19 seconds. A step cut by its limit leaves them to the
      # step that takes the environment down, which deletes them with the others.
      - name: Run the tests of the real tier
        timeout-minutes: 15
        run: pnpm test:real-project

      # Freelens dev, built as integration-tests.yaml builds it, for the sessions of the real tier. The tests install
      # this checkout in place, so Freelens loads the extension from dist/.
      - name: Build plugin
        id: build-plugin
        run: pnpm build
        continue-on-error: true

      - name: Build plugin (retry)
        id: build-plugin-2
        if: steps.build-plugin.outcome == 'failure'
        run: pnpm build
        continue-on-error: true

      - name: Build plugin (retry 2)
        if: steps.build-plugin-2.outcome == 'failure'
        run: pnpm build

      # Cache the .deb archives and package lists that `playwright install-deps` downloads through apt, so re-runs
      # reuse them instead of re-downloading. apt is pointed at this project-local directory via a global config file
      # written in the install step below.
      - name: Use APT cache
        uses: actions/cache@v6
        with:
          path: .apt
          key: ubuntu-24.04-apt-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ubuntu-24.04-apt-

      # The sessions attach to Electron's own Chromium over CDP, so Playwright's browsers are never downloaded.
      # `install-deps` still apt-installs the shared libraries that Chromium (and thus Electron) needs to launch
      # under xvfb. It runs the playwright that pnpm-lock.yaml pins.
      - name: Install Playwright's OS dependencies
        run: |
          set -eo pipefail
          # `playwright install-deps` runs its own `apt-get update`/`install`, so the archive/list redirect has to be
          # a global apt config file it picks up rather than per-invocation `-o` flags. dpkg's status stays at the
          # system default, so packages still install into the runner.
          mkdir -p .apt/cache/archives/partial .apt/state/lists/partial
          sudo tee /etc/apt/apt.conf.d/00freelens-cache >/dev/null <<EOF
          Dir::Cache::archives "$PWD/.apt/cache/archives";
          Dir::State::lists "$PWD/.apt/state/lists";
          EOF
          pnpm exec playwright install-deps chromium
          # apt ran as root, so hand the cache dir back to the runner user for the cache-save post step to read.
          sudo chown -R "$(id -u):$(id -g)" .apt

      - name: Checkout app
        uses: actions/checkout@v7
        with:
          repository: freelensapp/freelens
          ref: ${{ matrix.freelens_version }}
          path: freelens

      - name: Setup node for app
        uses: actions/setup-node@v7
        with:
          node-version-file: freelens/.nvmrc
          package-manager-cache: false

      # pnpm-lock.yaml holds several YAML documents (pnpm 12 puts packageManagerDependencies in a document of its
      # own), so evaluate them all and take the one that has the importer. The version carries a peer suffix, e.g.
      # 1.2.3(supports-color@8.1.1), which split drops.
      - name: Get Electron version
        run: |
          electron_version=$(yq ea -r '[.importers.freelens.devDependencies.electron.version | select(. != null)] | .[0] // error("electron not found in pnpm-lock.yaml") | split("(") | .[0]' freelens/pnpm-lock.yaml)
          echo "electron_version=${electron_version}" >> ${GITHUB_ENV}

      # install-electron downloads the Electron zip into the OS-default Electron cache dir. Restored here and saved
      # explicitly right after the "Install Electron binary" step below, as in integration-tests.yaml.
      - name: Restore Electron cache
        id: electron-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/electron
          key: ubuntu-24.04-electron-${{ env.electron_version }}
          restore-keys: |
            ubuntu-24.04-electron-

      # The same files as in Freelens's own integration tests workflow.
      - name: Use Turborepo cache
        uses: actions/cache@v6
        with:
          path: ${{ env.TURBOREPO_CACHE }}
          key: ubuntu-24.04-turborepo-${{ hashFiles('freelens/package.json', 'freelens/freelens/package.json', 'freelens/packages/**/package.json', 'freelens/pnpm-lock.yaml', 'freelens/turbo.json', 'freelens/tsconfig*.json', 'freelens/packages/infrastructure/typescript/config/*.json') }}
          restore-keys: |
            ubuntu-24.04-turborepo-

      # The binaries that ensure-binaries downloads in "Build extra resources", which Turborepo does not cache, saved
      # right after that step, as in integration-tests.yaml.
      - name: Restore bundled binaries cache
        id: binaries-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: freelens/freelens/binaries
          key: ubuntu-24.04-binaries-${{ hashFiles('freelens/freelens/binaries.lock.json') }}
          restore-keys: |
            ubuntu-24.04-binaries-

      - name: Install pnpm dependencies for app
        id: install-pnpm-app
        working-directory: freelens
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        continue-on-error: true

      - name: Install pnpm dependencies for app (retry)
        if: steps.install-pnpm-app.outcome == 'failure'
        working-directory: freelens
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # The electron package does not download its binary on install; installed here, it is there for the sandbox
      # setup below, and `predev` finds it in place, as in integration-tests.yaml.
      - name: Install Electron binary
        working-directory: freelens/freelens
        run: pnpm exec install-electron

      - name: Save Electron cache
        if: always() && steps.electron-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/electron
          key: ${{ steps.electron-cache-restore.outputs.cache-primary-key }}

      # kubectl and freelens-k8s-proxy, which the app needs to connect to a cluster. `pnpm dev` does not download
      # them.
      - name: Build extra resources
        id: build-resources
        working-directory: freelens
        run: pnpm --color=always build:resources
        continue-on-error: true

      - name: Build extra resources (retry)
        id: build-resources-2
        if: steps.build-resources.outcome == 'failure'
        working-directory: freelens
        run: pnpm --color=always build:resources
        continue-on-error: true

      - name: Build extra resources (retry 2)
        if: steps.build-resources-2.outcome == 'failure'
        working-directory: freelens
        run: pnpm --color=always build:resources

      - name: Save bundled binaries cache
        if: steps.binaries-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: freelens/freelens/binaries
          key: ${{ steps.binaries-cache-restore.outputs.cache-primary-key }}

      # FREELENS_INTEGRATION_TESTING_DIR gives Freelens dev a fresh profile; the app accepts it only under the system's
      # temporary directory. A dev profile syncs no kubeconfig by default, so the profile is seeded with one sync
      # entry: a copy of the kubeconfig of the scripts, which holds the cluster of the real project alone. The catalog
      # then lists that cluster and nothing else.
      - name: Seed the Freelens dev profile
        run: |
          kubeconfig="${RUNNER_TEMP}/freelens-capi-management.kubeconfig"
          cp "${XDG_STATE_HOME}/freelens-capi-extension/freelens-capi-management/kubeconfig" "$kubeconfig"
          mkdir -p "${FREELENS_INTEGRATION_TESTING_DIR}/FreelensDev"
          KUBECONFIG_FILE="$kubeconfig" yq -n -o json '.preferences.syncKubeconfigEntries = [{"filePath": strenv(KUBECONFIG_FILE)}]' \
            > "${FREELENS_INTEGRATION_TESTING_DIR}/FreelensDev/lens-user-store.json"
          cat "${FREELENS_INTEGRATION_TESTING_DIR}/FreelensDev/lens-user-store.json"
        env:
          FREELENS_INTEGRATION_TESTING_DIR: /tmp/freelens-integration-testing

      # Freelens dev, as a developer runs it, with its CDP endpoint on port 9223. It keeps running in the background
      # for the next steps; its output is the main log the sessions read. Electron's sandbox helper needs to be setuid
      # root.
      - name: Start Freelens dev
        working-directory: freelens
        run: |
          chrome_sandbox="$(dirname "$(cd freelens && node -p 'require("electron")')")/chrome-sandbox"
          sudo chown root:root "$chrome_sandbox"
          sudo chmod 4755 "$chrome_sandbox"
          nohup xvfb-run -a pnpm dev > "$FREELENS_MAIN_LOG" 2>&1 &
          if ! timeout 900 bash -c 'until curl -sf http://127.0.0.1:9223/json/version; do sleep 5; done'; then
            cat "$FREELENS_MAIN_LOG"
            exit 1
          fi
        env:
          # In GitHub Actions turbo groups the output of a task and prints it when the task ends, which a persistent
          # `dev` task never does.
          TURBO_LOG_ORDER: stream
          FREELENS_INTEGRATION_TESTING_DIR: /tmp/freelens-integration-testing
          FREELENS_MAIN_LOG: ${{ runner.temp }}/freelens-dev.log

      - name: Setup node for plugin
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # The sessions of the real tier in Freelens dev (SPEC-0004, "With the real project"; SPEC-0005, "With the real
      # project"): the view and the tree of a Cluster against clusterctl, and S6 with the Sveltos extension, which open
      # the cluster of the real project through the profile and reach it through the scripts, which check the target
      # before every request. They write only to that cluster: a label on freelens-capi-md and the definitions of
      # Sveltos, which they remove at their end. The sessions are deterministic, so a failure is not retried; they wait
      # for the objects of the real project that its controllers still write, five minutes at most for each wait. A
      # step that reaches its limit fails, as a case that reaches its own does, and loses the report of the sessions
      # after it, which a run of one file gives again.
      - name: Run the sessions of the real tier in Freelens dev
        run: timeout 2400 pnpm --color=always test:integration:real-project --reporter=verbose --reporter=github-actions --includeTaskLocation
        env:
          FREELENS_MAIN_LOG: ${{ runner.temp }}/freelens-dev.log
          TEST_KIND_CLUSTER_NAME: freelens-capi-management
          KUBECONFIG: ${{ runner.temp }}/freelens-capi-management.kubeconfig

      - name: Show Freelens dev output
        if: always()
        run: cat "${{ runner.temp }}/freelens-dev.log" || true

      # What the objects of the workload clusters say, without the kubeconfig or any Secret.
      - name: Show the workload clusters
        if: failure()
        run: kubectl get clusters.v1beta2.cluster.x-k8s.io,machines.v1beta2.cluster.x-k8s.io --all-namespaces || true
        env:
          KUBECONFIG: ${{ runner.temp }}/test-environment/freelens-capi-extension/freelens-capi-management/kubeconfig

      - name: Take the test environment down
        if: always()
        run: pnpm e2e:cluster:down

      # down checks what it leaves already; this says it from outside the scripts.
      - name: Check that nothing of the test environment is left
        run: |
          kind get clusters
          docker ps --all --format '{{.Names}}'
          test -z "$(kind get clusters 2>/dev/null | grep '^freelens-capi-' || true)"
          test -z "$(docker ps --all --format '{{.Names}}' | grep '^freelens-capi-' || true)"
